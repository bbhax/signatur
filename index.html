<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Navigation</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: #172033;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
    }

    main {
      width: min(100%, 620px);
      padding: 40px;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      background: #ffffff;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.12);
    }

    h1 {
      margin: 0 0 10px;
      text-align: center;
      font-size: clamp(2rem, 6vw, 3rem);
    }

    p {
      margin: 0 0 30px;
      text-align: center;
      color: #64748b;
    }

    ul {
      margin: 0;
      padding: 0;
      display: grid;
      gap: 14px;
      list-style: none;
    }

    a {
      display: block;
      padding: 17px 20px;
      border-radius: 12px;
      color: #ffffff;
      background: #334155;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.2s, background 0.2s;
    }

    a:hover,
    a:focus-visible {
      background: #2563eb;
      transform: translateY(-2px);
    }

    a:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 3px;
    }

    @media (max-width: 500px) {
      main {
        padding: 28px 20px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Unsere Gruppen</h1>
    <p>Wähle eine Seite aus:</p>

    <nav aria-label="Hauptnavigation">
      <ul>
        <li><a href="horizon-group.html">Horizon Group</a></li>
        <li><a href="mcp-group.html">MCP Group</a></li>
        <li><a href="primevest-group.html">Primevest Group</a></li>
        <li><a href="synergy-capital.html">Synergy Capital</a></li>
      </ul>
    </nav>
  </main>
</body>

</html>
